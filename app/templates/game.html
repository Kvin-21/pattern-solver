<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pattern Game</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar">
        <a href="{{ url_for('home') }}" class="back-button">
            <i class="fas fa-arrow-left"></i>
        </a>
        <a href="{{ url_for('settings') }}" class="settings-button">
            <i class="fas fa-cog"></i>
        </a>
    </nav>
    <div class="game-container">
        <h2>Pattern Game</h2>
        <div class="pattern-display">
            <p>Your sequence:</p>
            <div class="pattern-box">{{ pattern }}</div>
        </div>
        {% if error %}
            <div class="message error">{{ error }}</div>
        {% elif success %}
            <div class="message success">{{ success }}</div>
        {% endif %}
        <form method="POST" action="{{ url_for('game') }}" class="game-form">
            <div class="input-group">
                <input type="text" name="guess" placeholder="Enter your guess" required>
                <button type="submit" class="submit-button">
                    <i class="fas fa-check"></i>
                </button>
            </div>
        </form>
        {% if not user %}
            <div class="login-prompt">
                <p>Sign in to save your progress!</p>
                <a href="{{ url_for('login') }}" class="button">Login</a>
            </div>
        {% endif %}
    </div>
</body>
</html>
