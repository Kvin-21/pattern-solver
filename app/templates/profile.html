<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - Pattern Solver</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <style>
        .profile-container {
            background: rgba(0, 0, 0, 0.6);
            border-radius: 10px;
            padding: 20px;
            margin: 20px auto;
            max-width: 800px;
        }
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin: 20px 0;
        }
        .stat-card {
            background: rgba(255, 255, 255, 0.1);
            padding: 15px;
            border-radius: 8px;
        }
        .history {
            margin-top: 30px;
        }
        .pattern-card {
            background: rgba(255, 255, 255, 0.1);
            margin: 10px 0;
            padding: 15px;
            border-radius: 8px;
            text-align: left;
        }
        .timestamp {
            font-size: 0.8em;
            color: #aaa;
        }
    </style>
</head>
<body>
    <div class="profile-container">
        <h1>{{ user.username }}'s Profile</h1>
        
        <div class="stats">
            <div class="stat-card">
                <h3>Level</h3>
                <p>{{ user.level }}</p>
            </div>
            <div class="stat-card">
                <h3>Score</h3>
                <p>{{ user.score }}</p>
            </div>
        </div>

        <div class="history">
            <h2>Pattern History</h2>
            {% for pattern in patterns %}
            <div class="pattern-card">
                <p><strong>Pattern:</strong> {{ pattern.sequence }}</p>
                <p><strong>Solution:</strong> {{ pattern.solution }}</p>
                <p class="timestamp">{{ pattern.timestamp.strftime('%Y-%m-%d %H:%M:%S') }}</p>
            </div>
            {% endfor %}
        </div>

        <a href="{{ url_for('home') }}" class="button">Back to Home</a>
    </div>
</body>
</html>
