<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pattern Solver</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar">
        <a href="{{ url_for('home') }}" class="back-button">
            <i class="fas fa-arrow-left"></i>
        </a>
        <a href="{{ url_for('settings') }}" class="settings-button">
            <i class="fas fa-cog"></i>
        </a>
    </nav>
    <div class="solver-container">
        <h2>Pattern Solver</h2>
        <form method="POST" action="{{ url_for('solver') }}" class="solver-form">
            <div class="input-group">
                <input type="text" name="pattern" placeholder="Enter numbers separated by commas (e.g., 1,2,3,4). The more numbers there are, the more accurate the solver will be!" required>
                <button type="submit" class="submit-button">
                    <i class="fas fa-calculator"></i>
                </button>
            </div>
        </form>
        
        {% if error %}
            <div class="message error">{{ error }}</div>
        {% endif %}

        {% if pattern_type and next_terms %}
            <div class="solution-box">
                <h3>Pattern Analysis</h3>
                <div class="result-group">
                    <label>Original Pattern:</label>
                    <p>{{ original_pattern|join(', ') }}</p>
                </div>
                <div class="result-group">
                    <label>Pattern Type:</label>
                    <p>{{ pattern_type }}</p>
                </div>
                <div class="result-group">
                    <label>Next Three Terms:</label>
                    <p>{{ next_terms|join(', ') }}</p>
                </div>
            </div>
        {% endif %}
        
        {% if not user %}
            <div class="login-prompt">
                <p>Sign in to save your patterns!</p>
                <a href="{{ url_for('login') }}" class="button">Login</a>
            </div>
        {% endif %}
    </div>
</body>
</html>
